# RetailOS HTTPS 反向代理示例（TLS 终止）
# 用法：替换域名与证书路径后，作为 nginx 站点配置启用。
# 后端若运行在宿主机而非 Docker，请把 upstream 改为 http://127.0.0.1:3000
# 并删除 resolver 行。

server {
    listen 80;
    server_name retail.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # nginx >= 1.25.1 用 http2 on; 更低版本改成 listen 443 ssl http2;
    http2 on;
    server_name retail.example.com;

    # 证书：Let's Encrypt / 企业 CA
    ssl_certificate     /etc/letsencrypt/live/retail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retail.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS 默认关闭：确认证书与 HTTPS 正常后再取消注释
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://server:3000;

    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection '';
        # SSE 必须关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 7d;
        # 该 location 内出现 add_header 会覆盖继承的安全头，需重复声明
        add_header Cache-Control "public, max-age=604800, immutable";
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}
