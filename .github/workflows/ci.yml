name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: retailos
          MYSQL_USER: retailos
          MYSQL_PASSWORD: retailos_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: retailos
      DB_PASSWORD: retailos_dev
      DB_NAME: retailos
      DB_MIGRATIONS_RUN: 'true'
      JWT_SECRET: ci-jwt-secret
      LLM_PROVIDER: rule
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix server

      - name: Build
        run: |
          npm run build
          npm run build --prefix server

      - name: Start server
        run: |
          node server/dist/main.js > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Smoke
        run: npm --prefix server run smoke

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
