name: retailos

services:
  server:
    build: ./server
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: ${DB_USER:-retailos}
      DB_PASSWORD: ${DB_PASSWORD:-retailos_dev}
      DB_NAME: ${DB_NAME:-retailos}
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      JWT_SECRET: ${JWT_SECRET:-retailos-prod-secret}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-rule}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}

  web:
    build:
      context: .
      args:
        VITE_AGENT_TRANSPORT: sse
        VITE_AGENT_API_URL: /api/agent/stream
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
